  default_prompt: "Use $kuajing-wulaoshi-weekly-analysis to run this week's parent-ASIN anomaly analysis in trial mode, dispatch only the required high-priority diagnosis Skill, generate same-run structured evidence and evidence-based action suggestions, write each owner's authorized online action table with readback verification, and produce the fixed boss/owner BI and permission-scoped delivery outputs."

